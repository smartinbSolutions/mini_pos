name: Build POS System

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write # قمنا بتغييرها إلى write لتتمكن البيئة من رفع وبناء الحزم بحرية

jobs:
  build:
    runs-on: windows-latest # قمنا بتثبيته على ويندوز لتجنب مشاكل الروابط الرمزية وبناء better-sqlite3 و serialport للويندوز بشكل مباشر

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci # يفضل استخدام npm ci في السيرفرات لضمان تثبيت دقيق ومطابق لـ package-lock.json

      - name: Build Electron App
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # هامة جداً لـ electron-builder في حال رغبت برفع النسخة للـ Releases لاحقاً

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POS-Windows-Installer
          # نحدد مسار ملف الـ Setup والملفات الناتجة مباشرة لتجنب رفع مجلد dist بالكامل بما يحتويه من ملفات مؤقتة ضخمة
          path: |
            dist/*.exe
            dist/*.blockmap
